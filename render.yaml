# Foundation API only; the app preview has its separate render-play.yaml host.
services:
  - type: web
    name: spellwake-foundation
    runtime: rust
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: cargo build --locked --release -p spellwake-platform
    startCommand: ./target/release/spellwake-platform
    healthCheckPath: /health
    envVars:
      - key: SPELLWAKE_BIND
        value: 0.0.0.0:10000
