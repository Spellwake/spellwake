# Separate static preview from the foundation API; store publication remains gated.
services:
  - type: web
    name: spellwake-play
    runtime: static
    branch: main
    domains:
      - app.spellwake.com
    autoDeployTrigger: checksPass
    buildCommand: bun install --frozen-lockfile && bun run web:release:check && bun run release:assets && bun run web:build
    staticPublishPath: ./apps/play/dist
    envVars:
      - key: BUN_VERSION
        value: 1.3.11
      - key: SPELLWAKE_RELEASE_ASSETS
        value: "true"
      - key: SPELLWAKE_ASSETS_TOKEN
        sync: false
      - key: RELEASE_PREVIEW_APPROVED
        value: "true"
      - key: RELEASE_ASSETS_APPROVED
        sync: false
    headers:
      - path: /release.json
        name: Cache-Control
        value: no-store
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
