[package]
name = "spellwake-app"
version = "0.1.0"
description = "Spellwake native application"
edition = "2024"
publish = false

[lib]
name = "spellwake_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[lints.clippy]
all = "warn"

[workspace]
resolver = "3"
