[package]
name = "spellwake-app"
version = "0.1.0"
description = "Spellwake native application"
edition = "2024"
publish = false

[lib]
name = "spellwake_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-fs = "=2.7.1"
tauri-plugin-opener = "=2.7.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lints.clippy]
all = "warn"

[workspace]
resolver = "3"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
