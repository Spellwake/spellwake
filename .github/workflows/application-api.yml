name: Application API
on:
  pull_request:
  push:
    branches: [dev, staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Application contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run tsc --noEmit --strict -p packages/application-contracts/tsconfig.json
      - run: bun test packages/application-contracts

  application:
    name: Application Rust and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --manifest-path services/application/Cargo.toml --all --check
      - run: cargo clippy --locked --manifest-path services/application/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path services/application/Cargo.toml --workspace
      - name: Start an isolated PostgreSQL test container
        shell: bash
        run: |
          docker run --rm --detach --name spellwake-application-db --cidfile "$RUNNER_TEMP/spellwake-postgres.cid" \
            --publish 127.0.0.1:55439:5432 \
            --env POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          for _ in {1..30}; do
            if docker exec spellwake-application-db pg_isready -h 127.0.0.1 -U postgres; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - run: python3 services/application/tools/test_database.py
      - name: Stop the job's PostgreSQL container
        if: always()
        run: |
          cidfile="$RUNNER_TEMP/spellwake-postgres.cid"
          if [ -s "$cidfile" ]; then
            docker stop "$(cat "$cidfile")"
          fi

  linux-release:
    name: Application Linux release build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup show
      - name: Build locked API, worker and release tool
        run: |
          cargo build --locked --release --manifest-path services/application/Cargo.toml \
            --bin application_api --bin native_match_worker --bin native_release_candidate
      - name: Exercise the Linux API lifecycle
        env:
          SPELLWAKE_API_BIND: 127.0.0.1:58080
          SPELLWAKE_SUPABASE_URL: http://127.0.0.1:1
          SPELLWAKE_AUTH_ISSUER: http://127.0.0.1:1/auth/v1
          SPELLWAKE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_only
          SPELLWAKE_SUPABASE_SECRET_KEY: sb_secret_test_only
          SPELLWAKE_FREE_BACK_ID: 00000000-0000-4000-8000-000000000001
          SPELLWAKE_FREE_SLEEVE_ID: 00000000-0000-4000-8000-000000000002
          SPELLWAKE_FREE_DICE_ID: 00000000-0000-4000-8000-000000000003
        shell: bash
        run: |
          services/application/target/release/application_api &
          api_pid=$!
          trap 'kill -KILL "$api_pid" 2>/dev/null || true' EXIT
          base=http://127.0.0.1:58080
          health=$(curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 --max-time 3 "$base/health")
          jq -e '.status == "success" and .data.service == "spellwake-application"' <<< "$health"
          actor_status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 "$base/v1/account")
          test "$actor_status" = 401
          kill -TERM "$api_pid"
          wait "$api_pid"
          trap - EXIT
