[package]
name = "spellwake-card-programs"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
private-card-fixtures = []

[dependencies]
spellwake-engine.workspace = true
spellwake-contracts.workspace = true
spellwake-oracle-compiler.workspace = true
spellwake-content = { path = "../content" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

[dev-dependencies]
flate2 = "1"

[lints]
workspace = true

[[test]]
name = "interaction_registry"
required-features = ["private-card-fixtures"]

[[test]]
name = "mandatory_registry"
required-features = ["private-card-fixtures"]

[[test]]
name = "optional_payment_registry"
required-features = ["private-card-fixtures"]

[[test]]
name = "teaching_registry"
required-features = ["private-card-fixtures"]
