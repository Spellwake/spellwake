<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Spellwake · Play</title>
    <style>
      :root {
        color-scheme: dark;
        --ground: #202322;
        --panel: #292d2b;
        --ink: #eeeee7;
        --accent: #e7c78d;
        --line: #4b514b;
        font:
          15px/1.5 system-ui,
          sans-serif;
        color: var(--ink);
        background: var(--ground);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
      }
      main {
        position: relative;
        width: 100%;
        height: 100svh;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      button {
        font: inherit;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 10px 14px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
      [hidden] {
        display: none !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      #play-status {
        position: absolute;
        bottom: 20px;
        left: 20px;
      }
      #stack-preview {
        position: absolute;
        top: 20px;
        left: 20px;
      }
    </style>
  </head>
  <body>
    <main aria-label="Game table">
      <canvas
        id="play-canvas"
        tabindex="0"
        role="img"
        aria-label="Loading game table"
      ></canvas>
      <div
        id="opponent-navigation"
        class="sr-only"
        role="group"
        aria-label="View another player's board"
        hidden
      ></div>
      <button id="return-board" class="sr-only" type="button" hidden>
        Return to your board
      </button>
      <div id="stack-preview" hidden>
        <output id="stack-count" aria-live="polite"></output>
      </div>
      <output id="play-status" class="sr-only" role="status"
        >Loading table…</output
      >
    </main>
    <script type="module" src="/build/play-area-entry.js"></script>
  </body>
</html>
