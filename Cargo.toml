[workspace]
members = ["crates/contracts", "crates/engine", "crates/platform", "crates/reference_tools", "crates/content", "crates/card_programs"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.5"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
spellwake-contracts = { path = "crates/contracts" }
spellwake-engine = { path = "crates/engine" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
